name: Safe Build Kernel Droidspaces J8

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04   # Dùng Ubuntu 20.04 để tránh lỗi GCC Host Compiler quá mới

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev git

    - name: Download Toolchain GCC 4.9
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        export KCFLAGS="-w"
        export KCPPFLAGS="-w"
        
        make O=out j8y18lte_defconfig
        make -j$(nproc) O=out HOSTCC=gcc-9 KCFLAGS="-w"

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Compiled-Kernel-J8-Safe
        path: out/arch/arm64/boot/Image.gz-dtb
