name: Safe Build Kernel Droidspaces J8

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5 libncurses5-dev libncursesw5-dev libglib2.0-dev git ccache libelf-dev python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Download Toolchains (GCC 64 & 32)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain_64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain_32

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain_64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain_32/bin/arm-linux-androideabi-
        
        export KCFLAGS="-w"
        export KCPPFLAGS="-w"
        export HOSTCFLAGS="-w"
        export HOSTCXXFLAGS="-w"

        make O=out j8y18lte_defconfig HOSTCFLAGS="-w" HOSTCXXFLAGS="-w"
        make -j$(nproc) O=out HOSTCFLAGS="-w" HOSTCXXFLAGS="-w"

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-J8-Safe
        path: out/arch/arm64/boot/Image.gz-dtb
